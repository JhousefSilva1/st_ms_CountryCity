server:
  port: 8002
eureka:
  instance:
    hostname: localhost

    #   settings for AWS RDS PostgreSQL
#    hostname: mscountries.cfs6q686kbf1.us-east-2.rds.amazonaws.com
  client:
    service-url:
#      defaultZone: http://${eureka.instance.hostname}:8761/eureka/
       defaultZone: http://localhost:8761/eureka/
spring:
  jwt:
    secret: EstaEsUnaClaveSuperSecretaParaJWT1231QueTieneMasDe32Caracteres
    expiration: 86400000  # 24 horas en milisegundos
    refresh-expiration: 604800000  # 7 días en milisegundos

  application:
    name: country-city-microservice

  datasource:
#    this is for the local datrabase

#    url: jdbc:postgresql://localhost:5432/MsCountries
#    username: admin
#    password: 12345

#   settings for AWS RDS PostgreSQL

#    url: jdbc:postgresql://mscountries.cfs6q686kbf1.us-east-2.rds.amazonaws.com:5432/MsCountries
#    username: postgres
#    password: 12345678A

#    driver-class-name: org.postgresql.Driver

#       settings for AWS RDS PostgreSQL

        url: jdbc:postgresql://mscountries.czk8i6icy1zy.us-east-2.rds.amazonaws.com:5432/MsCountries
        username: postgres
        password: abc12345678ABC

        driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
logging:
  level:
    org.springframework.cloud.gateway: debug
